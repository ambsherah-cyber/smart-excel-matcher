name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pandas openpyxl rapidfuzz xlrd pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onedir --name SmartExcelMatcher --add-data "app.py;." --collect-all streamlit --collect-all pandas --collect-all openpyxl --collect-all rapidfuzz --collect-all altair --collect-all pyarrow --copy-metadata streamlit launcher.py

      - name: Package portable app
        run: |
          Compress-Archive -Path dist/SmartExcelMatcher -DestinationPath SmartExcelMatcher-Windows.zip

      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: SmartExcelMatcher-Windows
          path: SmartExcelMatcher-Windows.zip
